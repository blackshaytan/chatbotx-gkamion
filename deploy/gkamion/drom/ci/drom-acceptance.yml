name: DROM protected checkout acceptance
on:
  push:
    branches: [fix/drom-protected-checkout-from-89ec90a]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit to test/build
        required: true
        type: string
      build_worker:
        description: Build immutable worker image after integration onto verified production source
        required: true
        default: false
        type: boolean
      production_source_sha:
        description: Owner-verified source commit of currently deployed worker (required for image build)
        required: false
        type: string
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify requested revision
        env:
          REQUESTED: ${{ inputs.expected_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$REQUESTED" = "$GITHUB_SHA"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/gkamion/drom/requirements.lock
      - run: deploy/gkamion/drom/run-tests.sh
      - uses: actions/upload-artifact@v6
        with:
          name: drom-reviewed-source-${{ github.sha }}
          path: deploy/gkamion/drom
  worker:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_worker) || (github.event_name == 'push' && vars.DROM_BUILD_WORKER_SHA == github.sha)
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse unverified production source base
        env:
          PRODUCTION_SOURCE: ${{ inputs.production_source_sha || vars.DROM_PRODUCTION_SOURCE_SHA }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          echo "$PRODUCTION_SOURCE" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$PRODUCTION_SOURCE^{commit}"
          git merge-base --is-ancestor "$PRODUCTION_SOURCE" "$GITHUB_SHA"
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm turbo run check-types --concurrency=4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: worker
        with:
          context: .
          file: apps/worker/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/chatbotx-gkamion-worker:drom-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.gkamion.drom.production-source=${{ inputs.production_source_sha || vars.DROM_PRODUCTION_SOURCE_SHA }}
      - name: Record immutable release image
        env:
          DIGEST: ${{ steps.worker.outputs.digest }}
        run: echo "worker digest=$DIGEST" >> "$GITHUB_STEP_SUMMARY"
