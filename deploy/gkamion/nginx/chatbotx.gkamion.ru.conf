map $http_upgrade $connection_upgrade_chatbotx {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chatbotx.gkamion.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-chatbotx;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/chatbotx.gkamion.ru.access.log;
    error_log  /var/log/nginx/chatbotx.gkamion.ru.error.log warn;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chatbotx.gkamion.ru;

    ssl_certificate     /etc/letsencrypt/live/chatbotx.gkamion.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbotx.gkamion.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_chatbotx;

    # Sign-up is closed: the owner account exists. Remove these two blocks to
    # reopen it (e.g. before inviting a teammate without an account).
    location = /auth/sign-up {
        return 302 /auth/sign-in;
    }
    location = /api/auth/sign-up/email {
        return 403;
    }

    # Realtime (partykit) websockets: same mapping as the builder's /ws rewrite.
    location /ws/ {
        proxy_pass http://127.0.0.1:1999/;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Public files: same mapping as the builder's dev /storage rewrite (rustfs bucket).
    location /storage/ {
        proxy_pass http://127.0.0.1:9010/chatbotx/;
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:3123;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/chatbotx.gkamion.ru.ssl.access.log;
    error_log  /var/log/nginx/chatbotx.gkamion.ru.ssl.error.log warn;
}
