# Builds the GKamion fork's images on a GitHub runner (the VPS has too little
# free RAM for `next build`) and pushes them to GHCR. Manual only; the VPS
# pulls them with deploy/gkamion/up.sh.
name: GKamion images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to build"
        required: true
        default: "builder,worker,realtime,javascript-executor"
        type: string
      tag_latest:
        description: "Also move the :latest tag. Leave false until a rollout is approved."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: gkamion-images
  cancel-in-progress: false

jobs:
  # The VPS cannot run the builder's `tsc` (it needs ~8 GB) and `next build`
  # ignores type errors, so the type check runs here, next to the images.
  check-types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run check-types --concurrency=4

  build:
    name: Build ${{ matrix.service }}
    needs: check-types
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [builder, worker, realtime, javascript-executor]
    steps:
      - name: Skip unselected service
        id: selected
        run: |
          case ",${{ inputs.services }}," in
            *",${{ matrix.service }},"*) echo "build=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "build=false" >>"$GITHUB_OUTPUT" ;;
          esac

      - if: steps.selected.outputs.build == 'true'
        uses: actions/checkout@v7

      - if: steps.selected.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.selected.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.selected.outputs.build == 'true'
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/chatbotx-gkamion-${{ matrix.service }}"
          {
            echo "list<<EOF"
            echo "${image}:${GITHUB_SHA}"
            if [ "${{ inputs.tag_latest }}" = "true" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - if: steps.selected.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=gkamion-${{ matrix.service }}
          cache-to: type=gha,scope=gkamion-${{ matrix.service }},mode=min
