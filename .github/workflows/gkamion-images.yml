# Builds the GKamion fork's images on a GitHub runner (the VPS has too little
# free RAM for `next build`) and pushes them to GHCR. Manual only; the VPS
# pulls them with deploy/gkamion/up.sh.
name: GKamion images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to build"
        required: true
        default: "builder,worker,realtime,javascript-executor"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gkamion-images
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [builder, worker, realtime, javascript-executor]
    steps:
      - name: Skip unselected service
        id: selected
        run: |
          case ",${{ inputs.services }}," in
            *",${{ matrix.service }},"*) echo "build=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "build=false" >>"$GITHUB_OUTPUT" ;;
          esac

      - if: steps.selected.outputs.build == 'true'
        uses: actions/checkout@v7

      - if: steps.selected.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - if: steps.selected.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.selected.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatbotx-gkamion-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/chatbotx-gkamion-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=gkamion-${{ matrix.service }}
          cache-to: type=gha,scope=gkamion-${{ matrix.service }},mode=min
