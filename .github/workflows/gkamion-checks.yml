name: GKamion checks

# Tests and type checks run here instead of on the VPS, which shares its
# memory with production services.
on:
  push:
    branches: [feature/ru-channels-max-zzap-drom]
  workflow_dispatch:

concurrency:
  group: gkamion-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: i18n and notification tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter builder i18n:check

      - run: pnpm --filter builder i18n:ru status

      - working-directory: apps/builder
        run: >-
          pnpm exec vitest run
          __tests__/i18n-messages.test.ts
          __tests__/i18n-accept-language.test.ts
          __tests__/i18n-ru-tooling.test.ts
          __tests__/i18n-request-config.test.ts
          __tests__/i18n-hardcoded-scanner.test.ts
          __tests__/i18n-language-names.test.ts
          __tests__/lang-selector.test.tsx
          __tests__/api-parity-manifest.test.ts
          __tests__/public-spec-operations.test.ts
          __tests__/public-spec-options.test.ts
          __tests__/public-spec-mcp.test.ts
          __tests__/external-agent-api.test.ts
          __tests__/tasks-public-api.test.ts
          __tests__/tasks-private-api.test.ts
          __tests__/tasks-comments-api.test.ts
          __tests__/task-attachment-route.test.ts
          __tests__/tasks-mention-serialize.test.ts
          __tests__/tasks-session.test.ts
          __tests__/tasks-reminder-presets.test.ts
          __tests__/notifications-private-api.test.ts
          __tests__/workspace-token-scope-registry.test.ts
          __tests__/tasks-message-quote.test.ts
          __tests__/i18n-source-keys.test.ts
          src/features/flows/react-flow/steps/__tests__/create-task-registration.test.ts
          src/features/flows/react-flow/steps/create-task/__tests__/assignee-value.test.ts
          src/features/flows/react-flow/nodes/perform-action/__tests__/menu.test.ts

      - working-directory: packages/flow-config
        run: >-
          pnpm exec vitest run
          __tests__/create-task.test.ts
          __tests__/channel-policies.test.ts

      - working-directory: apps/builder
        run: >-
          pnpm exec vitest run
          __tests__/build-conversation-where-unread.test.ts
          __tests__/build-conversation-where-inbox-attention.test.ts
          __tests__/list-conversations-inbox-attention.test.ts
          __tests__/list-conversations-query.test.ts
          __tests__/list-conversations-ad-referral.test.ts
          __tests__/conversations-public-api.test.ts
          __tests__/conversations-public-scope.test.ts
          __tests__/public-list-queries-no-session.test.ts
          __tests__/use-thread-read-tracking.test.tsx
          __tests__/conversation-item.test.tsx
          __tests__/conversation-item-inbox-attention.test.tsx
          __tests__/bot-state-bar.test.tsx
          __tests__/chat-store-inbox-attention.test.ts
          __tests__/inbox-attention-helpers.test.ts
          __tests__/message-thread-pane-scroll.test.tsx
          __tests__/format-message-time.test.ts
          __tests__/message-item-timestamp.test.tsx
          src/features/conversations

      - working-directory: packages/database
        run: >-
          pnpm exec vitest run
          __tests__/conversation-unread.test.ts
          __tests__/contact-filter.test.ts
          __tests__/sharded-message-repository.test.ts
          __tests__/task-partial.test.ts
          __tests__/task-list-where.test.ts
          __tests__/chat-partials.test.ts
          __tests__/staff-chat-schema.test.ts
          __tests__/chat-repository.test.ts

      - working-directory: apps/worker
        run: pnpm exec vitest run __tests__/notification __tests__/incoming-push-policy.test.ts __tests__/received-message.test.ts

      - working-directory: packages/business
        run: >-
          pnpm exec vitest run
          __tests__/external-agent
          __tests__/external-agent/manager-join.test.ts
          __tests__/conversation-service.test.ts
          __tests__/message-create-outgoing.test.ts
          src/conversation/__tests__/conversation.service.test.ts
          __tests__/task
          __tests__/chat
          __tests__/notification
          __tests__/workspace-member.service.test.ts
          __tests__/inbox-team-service-members.test.ts

      - working-directory: packages/utils
        run: pnpm exec vitest run __tests__/internal-mentions.test.ts

      - working-directory: packages/encryption
        run: pnpm exec vitest run __tests__/media-token.test.ts

      - working-directory: apps/worker
        run: >-
          pnpm exec vitest run
          __tests__/external-agent-routing.test.ts
          __tests__/external-agent-reply.test.ts
          __tests__/external-agent-watch.test.ts
          __tests__/send-flow-step.test.ts
          __tests__/sender-signature.test.ts
          __tests__/sender-signature-send.test.ts
          __tests__/task-due-scan.test.ts
          __tests__/notification-realtime.test.ts
          __tests__/create-task-step-handler.test.ts
          __tests__/create-task-step-registration.test.ts
          __tests__/integration-worker-boot.test.ts
          __tests__/integration-worker-incoming-message.test.ts
          __tests__/external-request-handler.test.ts

  check-types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run check-types --concurrency=4
