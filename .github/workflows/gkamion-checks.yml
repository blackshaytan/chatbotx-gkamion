# Feature-branch-only CI entrypoint for the approved dialog-memory gate.
# Dispatch through the existing workflow ID; default branch remains unchanged.
name: dialog-memory-gate

# T02 mainDB-only v1 invalidation gate. Manual-only: dispatched by a human.
# No image build, no deploy, no access to any real database.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invalidation-gate:
    name: mainDB-only v1 invalidation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dialog_memory_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dialog_memory_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Explicit dedicated CI database; the test asserts this identity before
      # writing anything. DATABASE_URL is never consulted.
      DIALOG_MEMORY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/dialog_memory_gate
      PGPASSWORD: postgres
      DIALOG_MEMORY_TEST_ALLOW_WRITES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg (CI only)
        run: python -m pip install 'psycopg[binary]'

      - name: Run dialog memory invalidation gate
        # RED stage: this FAILS on the expected missing invalidation effects
        # (no triggers loaded). Intentionally no continue-on-error, no `|| true`.
        run: python scripts/dialog-memory-gate/test_invalidation.py -v

  timescale-gate:
    name: hosted TimescaleDB v1 invalidation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      timescale:
        image: timescale/timescaledb-ha@sha256:527b9bf3b0bdb654e18240217ded559282702cf34d005502540eb0bbe6f5d355
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dialog_memory_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dialog_memory_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Explicit dedicated CI database + password for the Timescale service.
      DIALOG_MEMORY_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/dialog_memory_gate
      PGPASSWORD: postgres
      DIALOG_MEMORY_TEST_ALLOW_WRITES: "1"
      DIALOG_MEMORY_TEST_EVIDENCE_PATH: ${{ runner.temp }}/dialog-memory-timescale-10902-characterization.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg (CI only)
        run: python -m pip install 'psycopg[binary]'

      - name: Run dialog memory TimescaleDB gate
        # Assert committed source invalidation, including compressed DML and
        # transactional TRUNCATE epochs; record upstream #10902 separately.
        # No fallback, no mocked storage.
        run: python scripts/dialog-memory-gate/test_timescale.py -v

      - name: Upload Timescale characterization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timescale-10902-characterization
          path: ${{ env.DIALOG_MEMORY_TEST_EVIDENCE_PATH }}
          if-no-files-found: warn
