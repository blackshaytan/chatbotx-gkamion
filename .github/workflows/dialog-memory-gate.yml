name: dialog-memory-gate

# T02 mainDB-only v1 invalidation gate. Manual-only: dispatched by a human.
# No image build, no deploy, no access to any real database.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invalidation-gate:
    name: mainDB-only v1 invalidation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Explicit dedicated CI database; the test asserts this identity before
      # writing anything. DATABASE_URL is never consulted.
      DIALOG_MEMORY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dialog_memory_gate
      DIALOG_MEMORY_TEST_ALLOW_WRITES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psycopg (CI only)
        run: python -m pip install 'psycopg[binary]'

      - name: Run dialog memory invalidation gate
        # RED stage: this FAILS on the expected missing invalidation effects
        # (no triggers loaded). Intentionally no continue-on-error, no `|| true`.
        run: python scripts/dialog-memory-gate/test_invalidation.py -v
